<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width",initial-scale=1>
  <title>
    ENROLLMENT PAGE
  </title>
  <link rel="stylesheet" href="styles.css"
</head>
<body>
     <!-- ENROLMENT SECTION -->

<section class="enrolment" id="contact">

    <h1 class="section-heading">Begin Your Journey</h1>

    <p class="form-description">
        Take the first step towards learning the Holy Quran.
        Fill out the form below to register your interest.
    </p>

    <form class="enrolment-form"
          action="mailto:hanzalaijaz9876@gmail.com"
          method="post"
          enctype="text/plain">

        <label for="name">Full Name</label>

        <input
            type="text"
            id="name"
            name="Name"
            placeholder="Enter your full name"
            required
        >


        <label for="course">Select Your Course</label>

        <select id="course" name="Course" required>

            <option value="" disabled selected>
                Choose a course
            </option>

            <option value="Noorani Qaida (Ages 4-6)">
                Noorani Qaida (Ages 4–6)
            </option>

            <option value="Quran with Tajweed (Ages 6-10)">
                Quran with Tajweed (Ages 6–10)
            </option>

            <option value="Hifz-ul-Quran (Ages 10+)">
                Hifz-ul-Quran (Ages 10+)
            </option>

        </select>
        <label for="email">Parent/Guardian Email</label>

        <input
            type="email"
            placeholder="Enter Parent Email Address">


        <label for="age">Age</label>

        <input
            type="number"
            id="age"
            name="Age"
            placeholder="Enter your age"
            min="1"
            max="100"
            required
        >
        <label


        <button onclick="window.location.href='hanzalaijaz9876@gmail.com'" type="submit" class="submit-button">
            Submit Application
        </button>

    </form>

</section>
</body>
</html>
